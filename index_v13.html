<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>頬袋ハムスター 試作</title>
<style>
  html, body { margin: 0; height: 100%; background: #2b2b2b; overflow: hidden; overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; touch-action: none; }
  /* スマホ用の、画面の隅の小さなボタン */
  .pad { position: fixed; bottom: 8px; display: flex; gap: 6px; z-index: 4; }
  .pad.L { left: 8px; } .pad.R { right: 8px; }
  button { font: 600 13px "Yu Gothic UI", "Hiragino Sans", "Meiryo", sans-serif; color: #eee; background: rgba(58,58,58,0.92);
    border: 1px solid #777; border-radius: 8px; height: 38px; padding: 0 10px; touch-action: manipulation; }
  button:active { background: #666; }
  button.arm { background: #8a3a2a; border-color: #ff8a6a; }
  /* 音量の目盛り */
  #vol { position: fixed; z-index: 5; background: rgba(0,0,0,0.82); color: #eee; border-radius: 10px; padding: 8px 10px;
    font: 600 13px "Yu Gothic UI", "Hiragino Sans", "Meiryo", sans-serif; top: 70px; left: 50%; transform: translateX(-50%); }
  #vol.touch { top: auto; left: auto; transform: none; right: 8px; bottom: 54px; }
  #vol .row { display: flex; align-items: center; gap: 6px; height: 34px; opacity: 0.75; }
  #vol .row.on { opacity: 1; }
  #vol .lab { width: 44px; } #vol .key { width: 44px; color: #aaa; font-weight: 400; text-align: right; }
  #vol .num { width: 18px; text-align: right; }
  #vol button { height: 30px; width: 34px; padding: 0; font-size: 16px; }
  #vol .bar { display: flex; gap: 2px; }
  #vol .bar i { display: block; width: 9px; height: 14px; background: #555; border-radius: 2px; }
  #vol .bar i.f { background: #ffd95a; }
  #vol .row.on .bar i.f { background: #fff27a; }
  /* 1曲の結果 */
  #result { position: fixed; z-index: 6; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(440px, calc(100vw - 32px));
    max-height: calc(100vh - 16px); overflow-y: auto; box-sizing: border-box;
    background: rgba(0,0,0,0.84); color: #eee; border-radius: 14px; padding: 18px 18px 14px; text-align: center;
    font: 600 15px "Yu Gothic UI", "Hiragino Sans", "Meiryo", sans-serif; }
  #result .ttl { font-size: 22px; margin-bottom: 10px; }
  #result .big { font-size: 20px; color: #fff27a; margin: 6px 0; }
  #result .stars { font-size: 40px; letter-spacing: 6px; line-height: 1.1; margin: 2px 0; }
  #result .stars .on { color: #ffd84a; text-shadow: 0 0 10px rgba(255,210,80,0.85); } #result .stars .off { color: #555; }
  #result .best { font-size: 14px; color: #ccc; margin: 2px 0 4px; }
  #result .best.rec { color: #fff27a; font-size: 22px; font-weight: 700; animation: rec 0.55s ease-in-out infinite alternate; }
  @keyframes rec { from { transform: scale(1); } to { transform: scale(1.12); } }
  #result .up { color: #fff27a; font-size: 16px; margin: 4px 0; }
  #result .nest { display: flex; align-items: center; gap: 8px; justify-content: center; font-size: 13px; color: #ffd98a; margin: 6px 0; flex-wrap: wrap; }
  #result .nbar { width: 110px; height: 8px; background: #444; border-radius: 4px; overflow: hidden; } #result .nbar i { display: block; height: 100%; background: #e8b830; }
  #rList .st { color: #ffd84a; letter-spacing: 1px; } #rList .st .off { color: #666; }
  #result .best .on { color: #ffd84a; } #result .best .off { color: #666; }
  /* 「？」のボタンと、遊び方の説明（ふだんは隠す） */
  .helpBtn { position: fixed; right: 10px; bottom: 6px; z-index: 4; width: 38px; height: 38px; border-radius: 19px; font-size: 18px; padding: 0; }
  .pad .helpBtn { position: static; width: 38px; }
  #help { position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: 7; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; }
  #help .hbox { background: rgba(22,22,22,0.96); color: #eee; border-radius: 14px; padding: 16px 18px 14px; width: min(600px, calc(100vw - 32px)); max-height: calc(100vh - 32px);
    overflow-y: auto; box-sizing: border-box; font: 500 14px "Yu Gothic UI", "Hiragino Sans", "Meiryo", sans-serif; }
  #help .htitle { font-size: 18px; font-weight: 700; margin: 0 0 6px; } #help h4 { margin: 12px 0 4px; font-size: 14px; color: #ffd98a; }
  #help ul { margin: 4px 0; padding-left: 20px; } #help li { margin: 3px 0; line-height: 1.5; }
  #help kbd { display: inline-block; min-width: 18px; padding: 0 5px; border: 1px solid #888; border-radius: 4px; background: #333; font: 600 12px monospace; text-align: center; }
  #help .close { display: block; margin: 12px auto 0; height: 38px; padding: 0 26px; }
  #vol .trow button { width: auto; padding: 0 10px; font-size: 13px; }
  #result .pick { color: #ccc; font-size: 13px; margin: 12px 0 6px; }
  #rList { display: grid; gap: 6px; }
  #rList button { height: auto; min-height: 40px; padding: 6px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; font-size: 14px; }
  #rList button small { color: #bbb; font-weight: 400; font-size: 12px; white-space: nowrap; }
  #rList button.new { min-height: 54px; font-size: 17px; background: #6b5a14; border-color: #ffd95a; }
  #rList button.new small { color: #ffe9a0; }
  #rList button.focus { outline: 3px solid #fff; outline-offset: 1px; }
  @media (max-height: 480px) {   /* 横向きのスマホ：詰めて、2列に */
    #result { top: 8px; transform: translateX(-50%); padding: 10px 12px; width: min(640px, calc(100vw - 24px)); font-size: 13px; }
    #result .ttl { font-size: 17px; margin-bottom: 2px; } #result .big { font-size: 17px; margin: 2px 0; } #result .pick { margin: 6px 0 4px; }
    #rList { grid-template-columns: 1fr 1fr; } #rList button, #rList button.new { min-height: 36px; font-size: 14px; } #rList button.new { grid-column: 1 / -1; }
  }
  #result .hint { color: #aaa; font-weight: 400; font-size: 12px; margin-top: 8px; }
  #result button.wipe { height: 30px; font-size: 12px; margin-top: 12px; background: rgba(70,40,40,0.9); border-color: #a77; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="pad L" id="padL" hidden><button id="bWarp">スタートへ</button><button id="bReset">最初から</button></div>
<div class="pad R" id="padR" hidden><button id="bVol">音量</button></div>
<button class="helpBtn" id="bHelp" title="遊び方（H）">？</button>
<div id="help" hidden><div class="hbox"><div class="htitle">遊び方</div><div id="hBody"></div><button class="close" id="hClose">とじる</button></div></div>
<div id="vol" hidden></div>
<div id="result" hidden><div class="ttl" id="rTitle"></div><div class="stars" id="rStars"></div><div class="big" id="rGain"></div><div class="best" id="rBest"></div>
  <div class="up" id="rUp"></div><div class="nest"><span id="rNest"></span><span class="nbar"><i id="rNbar"></i></span><span id="rNext"></span></div>
  <div class="pick">次の曲</div><div id="rList"></div><div class="hint" id="rHint"></div><button class="wipe" id="rWipe">巣と曲を最初からにする</button></div>
<script>
'use strict';
// ============================================================
//  調整用の数値 ― ここを書き換えてリロードすればすぐ試せる
// ============================================================
const CONFIG = {
  // ハムスターの最初の能力
  START_BODY: 1.2,          // 体の大きさ
  START_TEETH: 1.2,         // 歯の硬さ
  GROW_GOAL: 10,            // 体・歯の目盛りの目安（サビの前にここまで育てると、サビでたくさん食べられる）

  // 消化したときの能力の伸び方
  //   食べ物1個ごとに  硬さ割合 = 硬さ ÷ (大きさ + 硬さ)、 やわらかさ割合 = 1 − 硬さ割合
  //   体の大きさ += 大きさ × やわらかさ割合 × BODY_RATE   … やわらかいものほど体が伸びる（大きいほど多く）
  //   歯の硬さ   += 硬さ   × 硬さ割合       × TEETH_RATE  … 硬いものほど歯が伸びる（硬いほど多く）
  //   両方を同じ割合で上げ下げすると、ほぼその逆比で育つ速さが変わる（1曲のサビの前に、うまく遊べば8〜10くらいになるように）
  BODY_RATE: 0.024,
  TEETH_RATE: 0.024,

  // 頬袋
  //   容量 = POUCH_BASE + POUCH_PER_BODY × 体の大きさ  （入れた食べ物の「大きさ」の合計で数える）
  POUCH_BASE: 0,
  POUCH_PER_BODY: 4.5,
  // 消化：動きながら、頬袋の古いものから少しずつ消化していく（待ち時間なし）
  //   1秒に消化できる量 = DIGEST_SPEED × 体の大きさ （食べ物の「大きさ」の単位）
  DIGEST_SPEED: 1.1,
  DIGEST_FULL_BOOST: 2,     // 頬袋がいっぱいのときは、消化がこの倍速くなる

  // 食べ物  [大きさ, 硬さ, 個数, スタート地点からこの距離(px)以内に置く(0 なら全体), 見た目]
  //   見た目は硬さの割合で決まる（やわらかい＝薄い色の四角、硬い＝宝石）。'shell' は硬い殻に入った物
  FOODS: [
    [1.0, 1.0, 10, 150],                              // スタート地点のまわりの種：すぐ食べられる
    [2.0, 3.0, 4, 240, 'shell'],                      // スタート近くの殻つきのごちそう：大きさはすぐ足りるが、歯が足りない
    [1.0, 1.0, 28],                                   // 種：最初から食べられる
    // やわらかいもの（体が伸びる）＝果物
    //   序盤（大きさ3.4まで）は硬さ1.2以下：最初の歯のままで食べられる
    //   中盤からは少しずつ硬くして、歯も育てないと先へ進めないようにしてある
    [1.3, 0.5, 16],  [1.6, 0.6, 12], [2.0, 0.8, 10], [2.5, 1.0, 8], [3.4, 1.2, 7],
    [4.6, 2.0, 6],   [6.0, 3.0, 5],  [7.6, 4.0, 4],  [9.4, 5.0, 3],
    // 硬いもの（歯が伸びる）＝宝石
    [0.5, 1.3, 16], [0.65, 1.6, 12], [0.8, 2.0, 10], [1.0, 2.5, 8], [1.4, 3.4, 7],
    [1.8, 4.6, 6],  [2.4, 6.0, 5],   [3.0, 7.6, 4],  [3.8, 9.4, 4],
    // 大きくて硬いもの（両方伸びる）
    [3.0, 3.0, 4], [5.0, 5.0, 3], [7.0, 7.0, 2], [8.5, 8.5, 2],
  ],
  // 宝石の置き方：置き方が楽譜になる
  //   列      ：まっすぐ・ゆるく曲がった一列。順に食べると8分音符ずつテーマのメロディになり、食べ切るとドに着地してバンドが応える
  //   かたまり：四角や丸く固めたもの。ほぼ同時に食べた音は1つの和音になり、食べ切ると花が開くような分散和音ときらっ、バンドの応え
  GEM_ROW: [5, 8],          // 列の個数
  GEM_BLOB: [4, 6],         // かたまりの個数
  GEM_ROW_SHARE: 0.5,       // 宝石のうち、列にする割合（残りはかたまり）
  ROW_PACE: 1,              // 列の間隔：1 なら、ハムスターが全速力で進むと8分音符1つにちょうど1個ずつ食べる間隔（小さいほど詰まる）
                            //   その宝石が食べられる頃の体の大きさは「硬さ＋1」くらいと見て、その速さで決める
  ROW_BEND: 0.9,            // 列の曲がり具合の上限（列の端から端までで向きが変わる角度、ラジアン）
  GEM_CLEAR: 1,             // 列・かたまりのまわりに空ける幅 ＝ その宝石が食べられる頃のハムスターの直径 × これ ＋ PASS_MARGIN（壁と、その頃まだ取れない物から離す）
  GEM_CLUSTER_GAP: 3,       // かたまりの中の宝石どうしのすき間（px）
  GEM_NEAR_SOFT: 110,       // やわらかい物は、同じくらいの段の宝石の列・かたまりのそば（空ける幅のすぐ外、この距離(px)以内）に置く。0 なら全体にばらまく
  RESPAWN_SEC: 6,           // 食べたものが別の場所に生えてくるまで（秒）
  FOOD_GAP: 26,             // 食べ物どうしの最低すき間（px）。最初のハムスターが通れる幅にしておく
  // 閉じ込め防止：食べられない物どうし・食べられない物と壁のすき間は、いつも「ハムスターの直径 + PASS_MARGIN」以上にする
  //   体が大きくなってすき間が足りなくなったら、食べられない物が GAP_PUSH_SPEED（px/秒）でゆっくり離れる
  PASS_MARGIN: 8,
  GAP_PUSH_SPEED: 120,      // （体が速く大きくなるので、前の2倍）
  ITEM_SEP: 4,              // 物どうしは、いつもこれ(px)以上あける（重ねない）。取れない物を動かすときも、ほかの物にこれより近づく向きには動かさない

  // 操作感
  MOVE_SPEED: 200,          // 移動の速さ（px/秒）
  MOVE_SPEED_PER_BODY: 9,   // 体が 1 大きくなるごとに増える速さ
  ACCEL: 10,                // 動き出しのキビキビさ（大きいほどすぐ最高速になる）
  DECEL: 7,                 // 止まるときのキビキビさ（大きいほどすぐ止まる）
  // 食べ方（M キーで切り替え）
  //   'A'：Space で食べる＋十分小さい物は触れるだけで食べる
  //   'B'：食べられる物は全部、触れた瞬間に食べる（Space は使わない）
  EAT_MODE_START: 'B',
  R_HOLD_SEC: 0.8,          // R をこの秒数押し続けると最初からやり直し（短く押すとスタート地点に戻るだけ）
  EAT_REACH: 14,            // 体のふちからこの距離（px）までのものを食べられる
  EAT_INTERVAL: 0.12,       // Space 押しっぱなしで連続して食べる間隔（秒）
  // 十分小さいものは触れるだけで食べる（Space いらず）
  //   大きさ ≦ 体の大きさ × AUTO_EAT_SIZE  かつ  硬さ ≦ 歯の硬さ × AUTO_EAT_HARD  のもの
  AUTO_EAT_SIZE: 0.5,
  AUTO_EAT_HARD: 0.7,
  BOUNCE_SPEED: 200,        // 食べられないものに触れたときに弾かれる速さ（操作は止まらず、物に沿って滑れる）
  BOUNCE_SPEED_PUSH: 140,   //   当たった物も押されて動くとき（PUSH）は、少し弱く
  // 取れない物に当たったら、その物もハムスターの勢いで押されて、跳ねるように動いて、だんだん遅くなって止まる（K キーで入り切り）
  //   重さ ＝（物の幅 ÷ ハムスターの直径）² × PUSH_MASS。自分より大きい物ほど重く少ししか動かず、小さい物はよく飛ぶ。宝石の列・かたまりは、まるごと（全部の重さで）動く
  //   動いた物は、壁やほかの物に当たったら跳ね返る（物どうしは、いつも ITEM_SEP 以上あける）。押せても、食べられるようにはならない
  PUSH: true,
  PUSH_MASS: 1,
  PUSH_BOUNCE: 0.6,         // 跳ね返り（0〜1）
  PUSH_FRICTION: 3,         // だんだん遅くなる速さ（大きいほどすぐ止まる。止まるまでに進むのは、だいたい 初めの速さ ÷ これ）
  PUSH_MAX: 420,            // 押された物の速さの上限（px/秒）
  // 宝石のかたまりの連鎖の吸い込み：1つ食べたら、同じかたまりの残りのうち近くの物が、16分音符の刻みで次々と口へ吸い込まれる（J キーで入り切り）
  CHAIN: true,
  CHAIN_RANGE: 100,         // 食べた宝石から、この距離(px)以内の同じかたまりの宝石
  CHAIN_SFX_GAP: 0.07,      // 効果音モードのときの間隔（秒）
  BOUNCE_MIN_SPEED: 60,     // この速さ以上でぶつかったときだけ弾く（沿って滑っているときは弾かない）
  CORNER_ASSIST: 0.8,       // 物の角の近く（体の半径のこの割合以内）でぶつかったら、角を回り込むように横へ流す
  // マウス・タッチ：押している間（指を置いている間）、その位置に向かって走る（追いかけ）。キーボードの操作はいつでも使える
  CHASE_SLOW: 50,           // マウス・指とのきょりが これ＋体の半径(px) より近くなると、ゆっくり止まる
  // 吸い寄せ：食べられる物に近づくと、物の方から小さくなりながら口へすーっと吸い込まれてきて、食べられる（体が大きいほど広い）
  SUCK_RANGE: 1.5,          // 物と体のすき間が「体の半径 × これ」より近くなったら吸い込む
  SUCK_RANGE_TOUCH: 2.1,    // スマホでは少し広めに
  SUCK_MIN: 8,              // 体が小さいうちも、すき間がこれ(px)までは吸い込む
  SUCK_TIME: 0.15,          // 口に届くまでの秒数
  LIGHT_FX_FPS: 45,         // なめらかさがこれ（コマ/秒）を下回り続けたら、光や輪などの演出を軽くする（スマホ向け）
  // 画面に出す言葉：文は出さず、1〜2語だけ。画面の上の方に大きく太く、ぽんと出て MSG_HOLD 秒見せてから、MSG_FADE 秒でゆっくり消える。同時に出すのは1つまで
  MSG_SIZE: 34, MSG_SIZE_TOUCH: 26, MSG_HOLD: 1.7, MSG_FADE: 0.7,
  SHOW_LABELS: false,       // 食べ物の大きさ・硬さの数値を出す（false でも、「？」の説明を開いている間は出す）
  // バンドの顔ぶれ：画面の下に、その曲のバンドの楽器を10マス並べる（果物側＝体の5つはオレンジ、宝石側＝歯の5つは青）。鳴り始めたら光って、拍に合わせて弾む
  BAND_PANEL: true,
  // 1曲の目標：噴き出した宝の数で ★1〜★3（サビの間は、頬袋の中の数が★の目盛りを満たしていく）
  STARS: [100, 200, 300],

  // 見た目
  FIELD_W: 1400, FIELD_H: 860,
  PX_BASE: 6, PX_PER_SIZE: 8,   // 画面上の大きさ(px) = PX_BASE + PX_PER_SIZE × 大きさ（ハムスターの直径・食べ物の一辺で共通）
  POUCH_ITEM_SCALE: 0.55,       // 頬袋の中での食べ物の縮み具合（体が大きくなってから）
  POUCH_SCALE_SMALL: 0.95,      //   体が小さいうちはこれくらい大きく見せる（小さな物1つでも、ぷくっとはっきり膨らむ）
  POUCH_SCALE_UNTIL: 5,         //   体の大きさがここまでで、だんだん POUCH_ITEM_SCALE に近づける
  LABEL_RANGE: 110,             // これより近い食べ物に数値を表示（SHOW_LABELS か、説明を開いている間）
  // ハムスターの見た目の大きさ（当たり判定も同じ）：体の数値の伸びより速く大きくなる（食べられるかどうかは体の数値で決まる）
  //   最初（START_BODY）は前のまま。体10のときの直径が、前の体10の直径の HAM_SCALE_AT_10 倍。広場の短い辺 × HAM_MAX_FRAC で止まる
  HAM_SCALE_AT_10: 2.5,
  HAM_MAX_FRAC: 1 / 3,
  // カメラ：体が小さいうちはハムスターの周りに寄り、育つほど引いていく。サビと締めでは広場全体まで引く
  CAM_ZOOM_START: 1.56,         // 最初の寄り具合（広場全体が見えるときの何倍に大きく見せるか）。前は2.6：全速力のとき、背景が画面の上を流れる速さが前の6割になる
  CAM_FULL_AT: 8,               // 体の大きさがここまで育つと、広場全体が見える（パソコン）
  CAM_LEAD: 0.12,               // 走っている方向へ先回り（前は0.15）：全速力で走り続けると、ハムスターは画面の中心から、その向きの幅・高さのこの割合だけ後ろに来る
  CAM_LEAD_TIME: 0.25,          // 先回りの量を変えるなめらかさ（秒。この3倍くらいで変わりきる）。急に反対へ走っても、ぐいっと振らない
  CAM_SLOW: 0.4,                // 速さが全速力のこの割合より遅いとき（止まっている・ゆっくり小さく動いている）は先回りせず、
  CAM_DEADZONE: 0.6,            //   ハムスターが画面の真ん中のこの割合（幅・高さとも）の中にいる間は、画面を動かさない

// 列の形：中心からの位置の一覧。間隔は、その宝石が食べられる頃のハムスターが全速力で8分音符1つに進む距離 × ROW_PACE

// 食べた物を別の場所に生やす。宝石の列・かたまりは、最後の一つまで食べたら、同じ形のものを丸ごと別の場所に

  if (!ok) { r.t = 1.5; respawns.push(r); }

// 見た目の種類：硬さの割合で決まる（'shell' は表で指定）
function lookOf(s, h, boulder, look) {

  if (look) return look;
  const r = h / (s + h);
  return r >= 0.58 ? 'gem' : r <= 0.42 ? 'soft' : 'nut';
}

function spawnFood(s, h, boulder = false, instant = false, near = 0, look = undefined) {
  const w = px(s), kind = lookOf(s, h, boulder, look);
  const blocker = !(s <= ham.body + EPS && h <= ham.teeth + EPS), need = passWidth();
  const mates = kind === 'soft' && C.GEM_NEAR_SOFT > 0 && !near ? foods.filter(o => o.cluster && s >= o.h * 0.6 && s <= o.h * 1.6) : [];
  let x, y, ok = false, best = null, bestGap = -Infinity;
  for (let tries = 0; tries < 450 && !ok; tries++) {
    const loose = tries >= 300, scan = loose && instant;   // 見つからなければ：ほかの物と重ならない（ITEM_SEP あける）ことだけ守る
    const away = loose ? ham.r + w / 2 + 30 : keepAway(w);
    if (mates.length && tries < 200) {
      const m = mates[(Math.random() * mates.length) | 0], a = Math.random() * TAU;
      const d = (m.w + w) / 2 + (groups[m.cluster]?.clear || 0) + C.FOOD_GAP + Math.random() * C.GEM_NEAR_SOFT;
      x = clamp(m.x + Math.cos(a) * d, w / 2 + 8, C.FIELD_W - w / 2 - 8);

    } else {
      x = w / 2 + 8 + Math.random() * (C.FIELD_W - w - 16);

      else if (!loose && Math.abs(o.x - x) < m && Math.abs(o.y - y) < m) ok = false;

// サビの間は、何でも食べられる。噴き出した後から次の曲までも、取れない物には戻さない（大きな体のまま囲まれないように。食べるのは止まる）

  const set = new Set();
  for (const [s, h] of C.FOODS) if (s <= ham.body + EPS && h <= ham.teeth + EPS) set.add(s + '/' + h);

}

// ハムスターが通り抜けるのに必要なすき間（px）
const passWidth = () => hamD(ham.body) + C.PASS_MARGIN;

// 2つの四角のすき間（いちばん近いところの距離）と、a を b から離す向き
function rectGap(a, b) {
  const ddx = a.x - b.x, ddy = a.y - b.y, half = (a.w + b.w) / 2;
  const gx = Math.abs(ddx) - half, gy = Math.abs(ddy) - half;
  const sx = Math.sign(ddx) || 1, sy = Math.sign(ddy) || 1;

  if (gx > 0 && gy > 0) { const l = Math.hypot(gx, gy); nx = sx * gx / l; ny = sy * gy / l; }
  else if (gx > gy) { nx = sx; ny = 0; } else { nx = 0; ny = sy; }
  return { gap: Math.hypot(Math.max(gx, 0), Math.max(gy, 0)) * (gx > 0 || gy > 0 ? 1 : -1), nx, ny };

// 食べられない物どうし・壁とのすき間が、いまのハムスターの通れる幅より狭ければ、少しずつ離す

//   取れない物を動かすときは、ほかの物（食べられる物も）に ITEM_SEP より近づく向きには動かさない
//   それでも、食べられる物に近すぎる・重なっている・取れない物に囲まれて届かないときは、取れない物の方を離す（食べられる物は動かさない）

// mem（かたまり・列はまるごと）を dx, dy だけ動かしても、ほかの物に ITEM_SEP より近づかず、広場の外にも出ないか
function canShift(mem, dx, dy) {

      if (o === m || o.suck || (m.cluster && o.cluster === m.cluster)) continue;

}

// 画面に出す言葉：文は出さず、1〜2語だけ。画面の上の方に大きく太く、ぽんと出て、しばらく見せてから、ゆっくり消える
//   同時に出すのは1つまで。今出ている言葉より大事（prio が大きい）なら入れかえ、同じくらい大事なら1つ2つ待たせる。それより軽い言葉は出さない
let msg = null, fullCd = 0, motes = [];
const msgQ = [];
const msgLife = () => C.MSG_HOLD + C.MSG_FADE + 0.2;
function say(text, color = '#ffffff', prio = 1) {
  const m = { text, color, prio, t: 0 };
  if (!msg || prio > msg.prio) { msg = m; return; }
  if (msg.text === text || msgQ.some(q => q.text === text)) return;
  if (prio >= 2 && msgQ.length < 2) msgQ.push(m);
}
function msgTick(dt) {
  if (!msg) return;
  msg.t += dt;
  if (msgQ.length && msg.t > 1.1 && msg.t < msgLife() - C.MSG_FADE * 0.5) msg.t = msgLife() - C.MSG_FADE * 0.5;   // 次が待っているときは、早めに消し始める
  if (msg.t >= msgLife()) msg = msgQ.shift() || null;
}
// 体・歯が伸びた：文字の代わりに、オレンジ（体）・青（歯）の小さな光が上っていき、上の目盛りが光る
const hud = { flashB: 0, flashT: 0 };
function growFx(col, which) {
  for (let i = 0; i < 4; i++) motes.push({ x: ham.x + (Math.random() - 0.5) * ham.r, y: ham.y - ham.r * 0.4, vx: (Math.random() - 0.5) * 40, vy: -50 - Math.random() * 40, t: -i * 0.06, life: 0.8, col });
  hud['flash' + which] = 0.6;
}
function fullSay() { if (fullCd <= 0 && !feast()) { fullCd = 10; say('いっぱい！', '#ffd08a', 1); } }   // 頬袋がいっぱい（頬も赤く点滅する）

// ---------------- 食べる・消化 ----------------
function tryEat() {
  if (songOver || song.burst) return;
  let best = null, bestD = Infinity, block = null, blockD = Infinity;
  for (const f of foods) {
    if (f.born < 1 || f.suck) continue;
    const d = rectDist(f, ham.x, ham.y) - ham.r;
    if (d > C.EAT_REACH) continue;
    if (f.edible) { if (d < bestD) { bestD = d; best = f; } }
    else if (d < blockD) { blockD = d; block = f; }
  }
  if (!best) {
    if (block) {
      const dx = ham.x - block.x, dy = ham.y - block.y, d = Math.hypot(dx, dy) || 1;
      bounce(block, dx / d, dy / d);
    }
    return;
  }
  if (fill() >= capacity()) { fullSay(); return; }
  eat(best);
}

function eat(f) {
  const fi = foods.indexOf(f);
  if (fi >= 0) foods.splice(fi, 1);
  eatenCount++;
  if (feast()) song.chorusEaten++;
  if (!f.boulder && !f.cluster) respawns.push({ s: f.s, h: f.h, look: f.look === 'shell' ? 'shell' : undefined, t: C.RESPAWN_SEC * (0.7 + Math.random() * 0.6) });
  const left = ham.pouch.filter(it => it.cheek < 0).reduce((a, it) => a + it.s, 0);
  const right = ham.pouch.filter(it => it.cheek > 0).reduce((a, it) => a + it.s, 0);
  const cheek = left <= right ? -1 : 1;
  ham.pouch.push({
    s: f.s, h: f.h, boulder: f.boulder, look: f.look, seed: f.seed, cheek,
    w: f.w, w0: f.suck ? f.w * 0.35 : f.w, rot: (Math.random() - 0.5) * 0.9,
    lx: -ham.r * 0.1 + (Math.random() - 0.5) * 4, ly: cheek * ham.r * 0.8,
    fly: 0, fx: f.x, fy: f.y, left: 1, landed: false,
  });
  // 手触り：大きい物ほど大きく弾み、大きい音（触れて食べても同じ）。自分に近い大きさの物だけ画面も揺れる
  const ratio = clamp(f.s / ham.body, 0, 1);
  squash(ham.face, lerp(C.SQUASH_EAT_SMALL, C.SQUASH_EAT_BIG, ratio));
  if (ratio >= C.SHAKE_BIG_FROM && clock - lastShakeAt >= C.SHAKE_BIG_COOLDOWN) { shake = Math.max(shake, C.SHAKE_BIG); lastShakeAt = clock; }
  rings.push({ x: f.x, y: f.y, r0: f.w * 0.5, grow: 10 + f.w * 0.4, t: 0, life: 0.22, width: 2.5, color: '255,250,220' });
  if (f.cluster) groupEat(f, ratio);
  else sfxEat(ratio, kindOf(f.s, f.h));
}
// 宝石の列・かたまりの一つを食べた。最後の一つなら、締めの音（列）／完成の和音ときらっ（かたまり）を鳴らして、丸ごと別の場所に生やす
function groupEat(f, ratio) {
  const g = groups[f.cluster];
  if (!g) return sfxEat(ratio, 'hard');
  g.eaten++; g.sx += f.suck ? f.suck.x0 : f.x; g.sy += f.suck ? f.suck.y0 : f.y;   // かたまりのあった場所（吸い込まれた物は、もとの場所）
  const done = !foods.some(o => o.cluster === f.cluster);
  if (AC && C.SOUND_VOLUME > 0) {
    if (soundMode === 'music') { tick(); if (!mus.timer) musicStart(); }
    if (g.kind === 'row') rowNote(g, done); else blobNote(g, done, f.cluster, f.chain ? f.chain.snd : undefined);
  } else if (done && g.kind === 'blob') sparks.push({ x: g.sx / g.eaten, y: g.sy / g.eaten, t: 0, life: 0.8, s: 8 + 3 * g.n });
  if (g.kind === 'blob' && C.CHAIN && !f.chain && !done) startChain(f);
  if (done) {
    delete groups[f.cluster];
    respawns.push({ s: g.s, h: g.h, group: g.kind, n: g.n, t: C.RESPAWN_SEC * (0.7 + Math.random() * 0.6) });
  }
}

// かたまりの連鎖の吸い込み：近くの残り（CHAIN_RANGE 以内）を近い順に、16分音符の刻み（効果音モードは CHAIN_SFX_GAP 秒）で口に届くように吸い込む
//   音もその刻みで鳴り、和音が下から順に積み上がって、食べ切ると花が開くような和音へつながる
function startChain(f) {
  const fx = f.suck ? f.suck.x0 : f.x, fy = f.suck ? f.suck.y0 : f.y, d = o => Math.hypot(o.x - fx, o.y - fy);   // 吸い込まれた物は、もとの場所から測る
  const mem = foods.filter(o => o.cluster === f.cluster && !o.suck && !o.chain && d(o) <= C.CHAIN_RANGE).sort((a, b) => d(a) - d(b));
  if (!mem.length) return;
  const music = !!(AC && soundMode === 'music' && mus.timer), now = AC ? AC.currentTime : 0;
  const t0 = AC && C.SOUND_VOLUME > 0 ? Math.max(blobSnd.t, now) : now, k0 = music ? idx16(t0) : 0;
  mem.forEach((o, j) => {
    const snd = music ? T16(k0 + j + 1) : t0 + (j + 1) * C.CHAIN_SFX_GAP;
    o.chain = { snd, at: clock + (snd - now) };   // snd：音の時刻（音の時計）、at：口に届く時刻（ゲームの時計）
  });
}
function chainTick(canMunch) {
  for (const f of foods) {
    if (!f.chain || f.suck) continue;
    if (!canMunch || !f.edible || !C.CHAIN || (!feast() && fill() >= capacity())) { f.chain = null; continue; }   // 食べられないとき・頬袋がいっぱいなら、そこで止まる
    if (clock >= f.chain.at - C.SUCK_TIME) f.suck = { t: 0, x0: f.x, y0: f.y };
  }
}

// 頬袋の1個を消化しきった：能力が伸びる
function digestItem(it) {
  ham.pouch.splice(ham.pouch.indexOf(it), 1);
  const g = gains(it.s, it.h);
  ham.body += g.body; ham.teeth += g.teeth;
  ham.gainB += g.body; ham.gainT += g.teeth;
  digests++;
  LOG.push({ t: +time.toFixed(1), body: +ham.body.toFixed(2), teeth: +ham.teeth.toFixed(2) });
  checkUnlock();
}

// 能力が伸びて、前は食べられなかった種類が食べられるようになった瞬間の演出
function checkUnlock() {
  const now = edibleTypes(), fresh = [...now].filter(k => !ham.unlocked.has(k));
  if (!fresh.length || feast()) return;
  ham.unlocked = now;
  const freshSet = new Set(fresh);
  const hit = foods.filter(f => freshSet.has(f.s + '/' + f.h));
  const delay = unlockDelay();      // 音楽モードでは、次の拍で色が戻り、フレーズが鳴る
  for (const f of hit) { f.edible = true; f.reviveIn = Math.max(0.001, delay); }
  hit.filter(f => f.bumped).sort((a, b) => rectDist(a, ham.x, ham.y) - rectDist(b, ham.x, ham.y)).slice(0, 3)
    .forEach(f => { f.need = null; rings.push({ x: f.x, y: f.y, r0: f.w * 0.7, grow: 30 + f.w * 0.8, t: -Math.max(0, delay), life: 0.8, width: 5, color: '255,225,90' }); });
  const r = hamD(ham.body) / 2;
  ham.pulse = 1;
  shake = Math.max(shake, C.SHAKE_UNLOCK); lastShakeAt = clock;
  rings.push({ x: ham.x, y: ham.y, r0: r, grow: 90 + r, t: 0, life: 0.7, width: 6, color: '255,240,120' });
  rings.push({ x: ham.x, y: ham.y, r0: r, grow: 45 + r * 0.5, t: -0.12, life: 0.6, width: 3, color: '255,255,255' });
  say('レベルアップ！', '#fff27a', 2);
  sfxUnlock(delay);
}

// 足りない方（大きさと硬さに差があるとき）の、近くにあって今食べられる物を選ぶ。差が大きいほど強く呼ぶ
function scanCallers() {
  const d = (ham.body - ham.teeth) / Math.max(ham.body, ham.teeth);
  ham.callKind = Math.abs(d) > C.CALL_FROM && !openAll() ? (d > 0 ? 'hard' : 'soft') : null;
  ham.callStr = ham.callKind ? 0.15 + 0.85 * clamp((Math.abs(d) - C.CALL_FROM) / (C.CALL_FULL - C.CALL_FROM), 0, 1) : 0;
  ham.callers = !ham.callKind ? [] : foods
    .filter(f => f.edible && f.born >= 1 && !f.boulder && !f.suck && kindOf(f.s, f.h) === ham.callKind && rectDist(f, ham.x, ham.y) < C.CALL_RANGE)
    .sort((a, b) => rectDist(a, ham.x, ham.y) - rectDist(b, ham.x, ham.y)).slice(0, 3);
}

// つぶしと伸ばし：ang の向きにぎゅっとつぶれて、ばねでぽよんと戻る
function squash(ang, amt) { ham.sqAng = ang; ham.sqV += amt * 22; }

function bounce(f, nx, ny) {
  const bs = C.PUSH ? C.BOUNCE_SPEED_PUSH : C.BOUNCE_SPEED;
  ham.vx += nx * bs; ham.vy += ny * bs;   // 軽く押し返す（操作はそのまま効く）
  f.shake = 0.25; f.bumped = true; f.hitCd = 0.3;
  sfxBump(f.s > ham.body + EPS, f.h > ham.teeth + EPS);   // 大きさが足りない／歯が足りない で音を変える
  squash(Math.atan2(ny, nx), C.SQUASH_BUMP);
  if (!f.need || f.need.t > 0.5) f.need = { s: f.s > ham.body + EPS, h: f.h > ham.teeth + EPS, t: 0 };   // 吹き出しの絵（前の吹き出しが出たばかりなら、そのまま）
}

function collide(f) {
  const hw = f.w / 2;
  const cx = clamp(ham.x, f.x - hw, f.x + hw), cy = clamp(ham.y, f.y - hw, f.y + hw);
  const dx = ham.x - cx, dy = ham.y - cy, d = Math.hypot(dx, dy);
  if (d >= ham.r) return;
  let nx, ny;
  if (d > 1e-6) {
    nx = dx / d; ny = dy / d;
    ham.x = cx + nx * ham.r; ham.y = cy + ny * ham.r;
  } else {
    const ex = hw - Math.abs(ham.x - f.x), ey = hw - Math.abs(ham.y - f.y);
    if (ex < ey) { nx = Math.sign(ham.x - f.x) || 1; ny = 0; ham.x = f.x + nx * (hw + ham.r); }
    else { nx = 0; ny = Math.sign(ham.y - f.y) || 1; ham.y = f.y + ny * (hw + ham.r); }
  }
  const vn = ham.vx * nx + ham.vy * ny;   // ぶつかっていく向きの速さ
  if (vn < 0) { ham.vx -= vn * nx; ham.vy -= vn * ny; }   // ぶつかる向きの速さだけ消す → 物に沿って滑る
  // 面の端（角の近く）に当たったら、角を回り込むように横へ流す（引っかからない）
  //   斜めに押しているときは、その横向きの入力で自然に滑るので手を出さない
  const tx = -ny, ty = nx;
  if ((nx === 0 || ny === 0) && ham.ix * nx + ham.iy * ny < -0.9 && Math.abs(ham.ix * tx + ham.iy * ty) < 0.3) {
    const along = (ham.x - f.x) * tx + (ham.y - f.y) * ty;
    const edge = f.w / 2 - Math.abs(along);
    if (edge < ham.r * C.CORNER_ASSIST) {
      const dir = Math.sign(along) || 1, vt = ham.vx * tx + ham.vy * ty;
      const want = dir * (C.MOVE_SPEED + C.MOVE_SPEED_PER_BODY * ham.body) * 0.8;
      const nvt = vt + (want - vt) * 0.35;
      ham.vx += (nvt - vt) * tx; ham.vy += (nvt - vt) * ty;
    }
  }
  if (vn < -C.BOUNCE_MIN_SPEED && f.hitCd <= 0) {
    if (C.PUSH && !f.boulder) pushHit(f, nx, ny, -vn);   // 当たった物も、ハムスターの勢いで押されて跳ねる
    bounce(f, nx, ny);
  }
}
// 当たった物（宝石の列・かたまりは、まるごと）に、ハムスターの勢いを渡す。重い物（自分より大きい物）ほど少ししか動かず、小さい物はよく飛ぶ
function pushHit(f, nx, ny, sp) {
  const b = f.cluster && groups[f.cluster] ? groups[f.cluster] : f, j = sp * (1 + C.PUSH_BOUNCE) / (1 + pushMass(f));
  b.pvx = (b.pvx || 0) - nx * j; b.pvy = (b.pvy || 0) - ny * j;
  const v = Math.hypot(b.pvx, b.pvy);
  if (v > C.PUSH_MAX) { b.pvx *= C.PUSH_MAX / v; b.pvy *= C.PUSH_MAX / v; }
}
function pushMass(f) {   // 重さ：ハムスターを1として、（物の幅 ÷ ハムスターの直径）² × PUSH_MASS。列・かたまりは全部の合計
  const d = 2 * ham.r, mem = f.cluster ? foods.filter(o => o.cluster === f.cluster) : [f];
  return mem.reduce((a, o) => a + (o.w / d) ** 2, 0) * C.PUSH_MASS;
}
// 押された物を動かす：ほかの物（ITEM_SEP）や壁に当たったら、その向きの速さを跳ね返して、だんだん遅くなって止まる
function pushStep(dt) {
  const k = Math.exp(-dt * C.PUSH_FRICTION), movers = [];
  for (const id in groups) { const g = groups[id]; if (g.pvx || g.pvy) movers.push([g, foods.filter(o => o.cluster === +id && !o.suck)]); }
  for (const f of foods) if (!f.cluster && (f.pvx || f.pvy)) movers.push([f, [f]]);
  for (const [b, mem] of movers) {
    if (!C.PUSH || !mem.length || mem.some(o => o.edible || o.suck)) { b.pvx = b.pvy = 0; continue; }   // 食べられるようになった物は止める
    const dx = b.pvx * dt, dy = b.pvy * dt, mv = (x, y) => { for (const o of mem) { o.x += x; o.y += y; } };
    if (canShift(mem, dx, dy)) mv(dx, dy);
    else {
      if (dx && canShift(mem, dx, 0)) mv(dx, 0); else b.pvx *= -C.PUSH_BOUNCE;
      if (dy && canShift(mem, 0, dy)) mv(0, dy); else b.pvy *= -C.PUSH_BOUNCE;
    }
    b.pvx *= k; b.pvy *= k;
    if (Math.hypot(b.pvx, b.pvy) < 4) b.pvx = b.pvy = 0;
  }
}

// R キー：スタート地点（の近くの空いている所）に戻る。能力も頬袋の中身もそのまま
function warpToStart() {
  const sx = C.FIELD_W / 2, sy = C.FIELD_H / 2, r = hamD(ham.body) / 2;
  const free = (x, y) => x > r && y > r && x < C.FIELD_W - r && y < C.FIELD_H - r &&
    foods.every(f => f.edible || rectDist(f, x, y) >= r + 6);
  let to = [sx, sy];
  search: for (let d = 0; d < 600; d += 8) {
    for (let a = 0; a < TAU; a += Math.max(0.15, 8 / Math.max(d, 1))) {
      const x = sx + Math.cos(a) * d, y = sy + Math.sin(a) * d;
      if (free(x, y)) { to = [x, y]; break search; }
    }
  }
  rings.push({ x: ham.x, y: ham.y, r0: ham.r, grow: 30, t: 0, life: 0.35, width: 3, color: '255,255,255' });
  ham.x = to[0]; ham.y = to[1]; ham.vx = ham.vy = 0; cam.x = ham.x; cam.y = ham.y;
  for (const it of ham.pouch) it.fly = 1;
  rings.push({ x: ham.x, y: ham.y, r0: ham.r, grow: 40, t: 0, life: 0.45, width: 3, color: '255,255,255' });
}

// 頬袋の中での見た目の大きさ：体が小さいうちほど大きく見せる
const pouchScale = () => lerp(C.POUCH_SCALE_SMALL, C.POUCH_ITEM_SCALE, clamp((ham.body - C.START_BODY) / (C.POUCH_SCALE_UNTIL - C.START_BODY), 0, 1));
const pouchSide = it => it.w * pouchScale() * hamScale();

// 頬袋の中身を押し合わせて、ほっぺたの横にふくらませる（ハムスターの向きに沿った座標）
const POUCH_SHOW = 40;
function relaxPouch(dt) {
  const r = ham.r, P = ham.pouch.length > POUCH_SHOW ? ham.pouch.slice(-POUCH_SHOW) : ham.pouch;
  const k = 1 - Math.exp(-dt * 4);
  for (const it of P) {
    it.lx += (-r * 0.15 - it.lx) * k;
    it.ly += (it.cheek * r * 0.75 - it.ly) * k;
  }
  for (let iter = 0; iter < 4; iter++) {
    for (let i = 0; i < P.length; i++) {
      const a = P[i], ra = pouchSide(a) * Math.sqrt(a.left) * 0.6;   // 消化中のものは小さくなった分だけ詰まる
      const d0 = Math.hypot(a.lx, a.ly) || 1, minD = r * 0.55 + ra * 0.6;
      if (d0 < minD) { a.lx *= minD / d0; a.ly *= minD / d0; }
      if (a.ly * a.cheek < r * 0.3) a.ly = a.cheek * r * 0.3;
      for (let j = i + 1; j < P.length; j++) {
        const b = P[j];
        if (b.cheek !== a.cheek) continue;
        let dx = b.lx - a.lx, dy = b.ly - a.ly, d = Math.hypot(dx, dy);
        const min = ra + pouchSide(b) * Math.sqrt(b.left) * 0.6;
        if (d >= min) continue;
        if (d < 1e-3) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d = Math.hypot(dx, dy); }
        const push = (min - d) / 2;
        dx /= d; dy /= d;
        a.lx -= dx * push; a.ly -= dy * push; b.lx += dx * push; b.ly += dy * push;
      }
    }
  }
}

// ---------------- 更新 ----------------
function update(dt) {
  clock += dt;
  if (started && !songOver) time += dt;
  songTick(dt);                          // 曲の進み（場面・サビの雨・締め）
  if (song.nestShow > 0) song.nestShow -= dt;   // 曲の始まりに、巣の山を見せている

  // 進む向き（ix, iy）と強さ（mag：0〜1）。キーボードが優先、押していなければマウス・タッチ
  let ix = (input.right ? 1 : 0) - (input.left ? 1 : 0);
  let iy = (input.down ? 1 : 0) - (input.up ? 1 : 0), mag = 0;
  if (ix || iy) { const l = Math.hypot(ix, iy); ix /= l; iy /= l; mag = 1; }
  else [ix, iy, mag] = pointerSteer();
  if (ham.shiver) mag *= 0.15;                           // ためている間は、ほとんど動かない
  if (mag > 0) started = true;
  ham.ix = ix; ham.iy = iy;
  const speed = C.MOVE_SPEED + C.MOVE_SPEED_PER_BODY * ham.body;
  const k = 1 - Math.exp(-dt * (mag > 0 ? C.ACCEL : C.DECEL));   // 少しの加速・減速
  ham.vx += (ix * mag * speed - ham.vx) * k; ham.vy += (iy * mag * speed - ham.vy) * k;
  ham.x += ham.vx * dt; ham.y += ham.vy * dt;
  ham.r += (hamD(ham.body) / 2 - ham.r) * (1 - Math.exp(-dt * 5));
  ham.x = clamp(ham.x, ham.r, C.FIELD_W - ham.r);
  ham.y = clamp(ham.y, ham.r, C.FIELD_H - ham.r);
  if (mag > 0.03) {
    const a = Math.atan2(iy, ix);
    ham.face += Math.atan2(Math.sin(a - ham.face), Math.cos(a - ham.face)) * (1 - Math.exp(-dt * 12));
  }
  if (ham.pulse > 0) ham.pulse = Math.max(0, ham.pulse - dt / 0.5);
  // 食べたときの弾み・頬袋のぽよん（ばね）
  ham.sqV += (-300 * ham.sq - 11 * ham.sqV) * dt; ham.sq = clamp(ham.sq + ham.sqV * dt, -0.45, 0.55);
  updateCamera(dt);
  if (clock - mus.grooveAt > C.GROOVE_HOLD) mus.groove = Math.max(0, mus.groove - dt * C.GROOVE_FADE);   // 果物のベースの層：だんだん薄く
  ham.puff += (Math.sqrt(fill() / (C.POUCH_PER_BODY * ham.body)) - ham.puff) * (1 - Math.exp(-dt * 4));   // 頬袋のふくらみ（サビでは、ぱんぱんに）
  if (ham.relief > 0) ham.relief -= dt;
  // 足りない方の物が呼ぶ（音楽モードでは拍に合わせて背景の中で鳴る）
  if ((ham.callScan -= dt) <= 0) { ham.callScan = 0.3; scanCallers(); }
  if (AC && soundMode !== 'music') pumpQueue(AC.currentTime);   // 効果音モード：並べた音を順に鳴らす（音楽モードは音楽の刻みの中で鳴らす）
  for (const c of ['-1', '1']) { const w = ham.cheekW[c]; w[1] += (-260 * w[0] - 9 * w[1]) * dt; w[0] = clamp(w[0] + w[1] * dt, -0.3, 0.5); }
  shake = Math.max(0, shake - dt * C.SHAKE_DECAY);

  for (const f of foods) {
    f.edible = canEat(f);
    if (f.born < 1) f.born = Math.min(1, f.born + dt / (f.fall ? 0.55 : 0.35));   // 降ってくる物は、ゆっくり落ちてくる
    if (f.flash > 0) f.flash -= dt;
    if (f.pop > 0) f.pop = Math.max(0, f.pop - dt / 0.45);
    if (f.reviveIn > 0 && (f.reviveIn -= dt) <= 0) {        // 取れるようになった物に、色がぱっと戻る
      f.revive = 1; f.flash = 1.8; f.pop = 1;
      rings.push({ x: f.x, y: f.y, r0: f.w * 0.6, grow: 16 + f.w * 0.5, t: 0, life: 0.35, width: 3, color: '255,245,170' });
    }
    if (f.revive > 0) f.revive = Math.max(0, f.revive - dt / 0.3);
    f.dim = !f.edible || f.reviveIn > 0 ? 1 : f.revive;
    if (f.shake > 0) f.shake -= dt;
    if (f.msgCd > 0) f.msgCd -= dt;
    if (f.hitCd > 0) f.hitCd -= dt;
  }
  keepGaps(dt);
  pushStep(dt);                          // 押された物：跳ねるように動いて、だんだん止まる
  for (let pass = 0; pass < 2; pass++) {   // 2つの物に同時に触れていても、両方から押し出す
    for (const f of foods) if (!f.edible && f.born >= 1) collide(f);
    ham.x = clamp(ham.x, ham.r, C.FIELD_W - ham.r);
    ham.y = clamp(ham.y, ham.r, C.FIELD_H - ham.r);
  }

  ham.eatCd -= dt;
  if (eatMode === 'A' && (input.eatQueued || (input.eat && ham.eatCd <= 0))) {
    input.eatQueued = false; ham.eatCd = C.EAT_INTERVAL; tryEat();
  }
  input.eatQueued = false;
  // 触れた瞬間に食べる（A：十分小さい物だけ ／ B：食べられる物は全部）
  const canMunch = !songOver && !song.burst && !ham.shiver;
  if (canMunch) {
    for (const f of foods.slice()) {
      if (f.born < 1 || f.suck || !(eatMode === 'B' ? f.edible : canTouchEat(f)) || rectDist(f, ham.x, ham.y) >= ham.r) continue;
      if (fill() >= capacity()) break;
      eat(f);
    }
  }
  chainTick(canMunch);                   // かたまりの連鎖の吸い込み
  suckFoods(dt, canMunch);               // 吸い寄せ
  if (canMunch && eatMode === 'B' && !feast() && fill() >= capacity()) fullSay();
  // 消化：頬袋に入ったものを、古いものから少しずつ消化する（動きながら進む）。サビの間は止まって、頬袋にたまり続ける
  if (!songOver && !feast() && !song.burst) {
    let budget = C.DIGEST_SPEED * ham.body * dt * (fill() >= capacity() ? C.DIGEST_FULL_BOOST : 1);
    while (budget > 0) {
      const it = ham.pouch.find(p => p.landed);
      if (!it) break;
      const rest = it.s * it.left;
      if (budget >= rest) { budget -= rest; digestItem(it); }
      else { it.left -= budget / it.s; budget = 0; }
    }
  }
  // 伸びた量は、ある程度たまったらまとめて表示して、きらきらの音を鳴らす
  if ((ham.gainCd -= dt) <= 0 && ham.gainB / ham.body + ham.gainT / ham.teeth >= C.GROW_FX_STEP) {
    if (ham.gainB > 0.004) growFx('255,170,80', 'B');
    if (ham.gainT > 0.004) growFx('120,200,255', 'T');
    sfxGrow(ham.gainB / ham.body, ham.gainT / ham.teeth);
    ham.gainB = ham.gainT = 0; ham.gainCd = 0.8;
  }
  // R の長押し：この曲を最初から
  if (input.rHeld) {
    input.rTime += dt;
    if (input.rTime >= C.R_HOLD_SEC) { input.rHeld = false; reset(); }
  }

  for (const it of ham.pouch) {
    if (it.fly < 1) it.fly = Math.min(1, it.fly + dt / 0.16);
    if (it.fly >= 1 && !it.landed) {   // 頬袋に着いた瞬間、ぽよんと揺れる
      it.landed = true;
      ham.cheekW[it.cheek][1] += 2.2 + 6 * clamp(pouchSide(it) / ham.r, 0, 1.6);
    }
  }
  relaxPouch(dt);

  for (let i = respawns.length - 1; i >= 0; i--) {
    const r = respawns[i];
    if ((r.t -= dt) <= 0) { respawns.splice(i, 1); respawnFood(r); }
  }
  msgTick(dt);
  if (fullCd > 0) fullCd -= dt;
  for (const k of ['flashB', 'flashT']) if (hud[k] > 0) hud[k] = Math.max(0, hud[k] - dt);
  for (const m of motes) { m.t += dt; if (m.t > 0) { m.x += m.vx * dt; m.y += m.vy * dt; } }
  motes = motes.filter(m => m.t < m.life);
  for (const f of foods) if (f.need && (f.need.t += dt) > 1.8) f.need = null;
  starTick(dt);
  bandTick(dt);
  for (const g of rings) g.t += dt;
  rings = rings.filter(g => g.t < g.life);
  for (const k of sparks) k.t += dt;
  sparks = sparks.filter(k => k.t < k.life);
  // 噴き出した物：放物線で巣へ。着いたら宝の山に積もって、ドの和音のきらきらが上から下へ
  for (const p of flyers) { p.t += dt; if (p.t >= p.T) { p.done = true; nestAdd(p); rainNote(); } }
  if (flyers.length) flyers = flyers.filter(p => !p.done);
}

// カメラ：走っている方向へ先回りする（全速力で走り続けると、ハムスターは画面の中心から、その向きの CAM_LEAD だけ後ろに来る）
//   止まっている・ゆっくり小さく動いているときは、ハムスターが真ん中の CAM_DEADZONE の中にいる間は画面を動かさない
//   体が育つほど引いていき、サビと締めでは広場全体が見えるまで引く
function updateCamera(dt) {
  const wide = feast() || song.burst || songOver ? 1 : 0;
  cam.wide += (wide - cam.wide) * (1 - Math.exp(-dt * 1.2));
  let zt = lerp(zoomFor(ham.body), 1, cam.wide);
  if (song.nestShow > 0 && view.VS > 0) {             // 曲の始まり：巣の山がまるごと見えるまで、少し引く
    const base = view.VS / Math.max(cam.zoom, 1e-3), need = Math.max(22, pileR(nest.total)) * 2.8;
    zt = Math.min(zt, Math.max(1, Math.min(view.w, view.h) / (base * need)));
  }
  cam.zoom += (zt - cam.zoom) * (1 - Math.exp(-dt * 1.5));
  const top = C.MOVE_SPEED + C.MOVE_SPEED_PER_BODY * ham.body, sp = Math.hypot(ham.vx, ham.vy) / top, w = C.CAM_FOLLOW;
  const vw = view.w / view.VS, vh = view.h / view.VS;
  cam.fast = cam.fast ? sp > C.CAM_SLOW * 0.8 : sp > C.CAM_SLOW * 1.15;   // 少しゆとりを持たせて切り替える（ちらつかないように）
  // 先回りと「動かない範囲」を、どちらも「ハムスターからのずれ」で表してつなぐ（切り替わっても、画面が行ったり来たりしない）
  const kl = 1 - Math.exp(-dt / C.CAM_LEAD_TIME), zx = vw * C.CAM_DEADZONE / 2, zy = vh * C.CAM_DEADZONE / 2;
  if (cam.fast) {                                     // 先回り：向きと速さに合わせて、いまのずれから、なめらかに（ついていく遅れの分も、前に足しておく）
    //   先回りを縮めるときは、ハムスターが進む分より速くは縮めない（画面が進む向きと反対へ戻らない）
    const ease = (l, v, size) => { const d = (v / top * C.CAM_LEAD * size + 2 * v / w - l) * kl; return l + (v * d < 0 ? Math.sign(d) * Math.min(Math.abs(d), Math.abs(v) * dt * 0.9) : d); };
    cam.lx = ease(cam.lx, ham.vx, vw); cam.ly = ease(cam.ly, ham.vy, vh);
  } else {                                            // 動かない範囲：ハムスターがこの中にいる間は、そのまま（いまのずれを、そのまま覚えておく）
    cam.lx = clamp(cam.x - ham.x, -zx, zx); cam.ly = clamp(cam.y - ham.y, -zy, zy);
  }
  const tx = ham.x + cam.lx, ty = ham.y + cam.ly;
  // ばねで、なめらかに追う（急に向きを変えても、ぐいっと振らない）
  cam.vx += ((tx - cam.x) * w * w - 2 * w * cam.vx) * dt; cam.vy += ((ty - cam.y) * w * w - 2 * w * cam.vy) * dt;
  cam.x += cam.vx * dt; cam.y += cam.vy * dt;
  for (const [a, va, size, FS] of [['x', 'vx', vw, C.FIELD_W], ['y', 'vy', vh, C.FIELD_H]]) {
    const edge = Math.max(0, size / 2 - ham.r - 12), d = ham[a] - cam[a];
    if (Math.abs(d) > edge) cam[a] = ham[a] - Math.sign(d) * edge;               // 画面の外には出さない
    const c = FS > size ? clamp(cam[a], size / 2, FS - size / 2) : FS / 2;        // 広場の外は映さない
    if (c !== cam[a]) { cam[a] = c; cam[va] = 0; }
  }
}

// ---------------- マウス・タッチの操作 ----------------
const toWorld = (sx, sy) => [(sx - view.ox) / view.VS, (sy - view.oy) / view.VS];
// 目標に向かう向きと強さ。近づくほど弱くして、ゆっくり止まる
function seek(tx, ty, rest) {
  const dx = tx - ham.x, dy = ty - ham.y, d = Math.hypot(dx, dy);
  if (d < 1.5) return [0, 0, 0];
  return [dx / d, dy / d, clamp((rest ?? d) / (C.CHASE_SLOW + ham.r), 0, 1)];
}
// 追いかけ：押している間（指を置いている間）、押した所へ。近づくと、ゆっくり止まる
//   目標は、指を動かしたときの広場の位置で覚えておく（指を止めたまま押し続けても、画面が動いて目標がずれていかない）
function pointerSteer() {
  if (!ptr.down) return [0, 0, 0];
  return seek(ptr.wx, ptr.wy);
}
const ptrAim = () => { [ptr.wx, ptr.wy] = toWorld(ptr.sx, ptr.sy); };
// 吸い寄せ：近くの食べられる物が、小さくなりながら口へすーっと飛んできて、口に届いたら食べる
const suckRange = () => Math.max(C.SUCK_MIN, ham.r * (touchUI ? C.SUCK_RANGE_TOUCH : C.SUCK_RANGE));
function suckFoods(dt, start) {
  let inflight = 0;
  for (const f of foods) if (f.suck) inflight += f.s;
  if (start) {
    const range = suckRange();
    for (const f of foods) {
      if (f.suck || f.boulder || f.born < 1 || !(eatMode === 'B' ? f.edible : canTouchEat(f))) continue;
      if (rectDist(f, ham.x, ham.y) - ham.r > range) continue;
      if (fill() + inflight >= capacity()) break;        // 頬袋がいっぱいなら吸わない
      f.suck = { t: 0, x0: f.x, y0: f.y }; inflight += f.s;
    }
  }
  const mx = ham.x + Math.cos(ham.face) * ham.r * 0.8, my = ham.y + Math.sin(ham.face) * ham.r * 0.8;   // 口（体の大きさに合わせて）
  for (const f of foods.slice()) {
    if (!f.suck) continue;
    const p = Math.min(1, (f.suck.t += dt) / C.SUCK_TIME), e = p * p;   // だんだん速く
    f.x = lerp(f.suck.x0, mx, e); f.y = lerp(f.suck.y0, my, e);
    if (p >= 1) eat(f);
  }
}

// ---------------- 描画 ----------------

function render() {
  // 細かさ：スマホは2倍まで、動きが重いときは1倍にして軽くする
  const dpr = Math.min(window.devicePixelRatio || 1, lowFx ? 1 : touchUI ? 2 : 3), W = innerWidth, H = innerHeight;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) {
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = S.look.bg; ctx.fillRect(0, 0, W, H);
  const compact = touchUI || H < 540 || W < 900;          // スマホや小さな窓：上の表示を詰める
  // 下の段（バンドの顔ぶれと、いまの目標の一言）：スマホでは、隅のボタンの間に収まればそこへ、収まらなければボタンの上へ
  const padW = touchUI ? (padL.offsetWidth || 0) + (padR.offsetWidth || 0) + 32 : 0, between = touchUI && W - padW >= 300;
  const BAND = 22, TOP = BAND + (compact ? 46 : 64), PAD = compact ? 6 : 10;   // いちばん上に、曲の進み具合の細い帯
  const BOTTOM = !touchUI ? 46 : between ? 52 : 84;
  // カメラ：体が小さいうちはハムスターの周りに寄り、育つほど引いて、最後は広場全体が見える
  //   画面の縦横比が広場と大きくちがうとき（スマホなど）は、広場全体を小さく収めず、少し寄せて見やすくする
  const ax = PAD, ay = TOP, aw = Math.max(1, W - PAD * 2), ah = Math.max(1, H - TOP - BOTTOM - PAD);
  const full = Math.min(aw / C.FIELD_W, ah / C.FIELD_H), cover = Math.max(aw / C.FIELD_W, ah / C.FIELD_H);
  //   サビと締めでは、広場全体が見えるまで引く（cam.wide）
  const VS = full * lerp(Math.max(1, Math.sqrt(cover / full / 1.3)), 1, cam.wide) * cam.zoom * (touchUI ? lerp(C.CAM_ZOOM_TOUCH, 1, cam.wide) : 1);
  const hw = aw / 2 / VS, hh = ah / 2 / VS;
  const cx = C.FIELD_W > hw * 2 ? clamp(cam.x, hw, C.FIELD_W - hw) : C.FIELD_W / 2;
  const cy = C.FIELD_H > hh * 2 ? clamp(cam.y, hh, C.FIELD_H - hh) : C.FIELD_H / 2;
  const sx = shake * Math.sin(clock * 71), sy = shake * Math.cos(clock * 53);   // 画面の揺れ
  const ox = ax + aw / 2 - cx * VS + sx, oy = ay + ah / 2 - cy * VS + sy;
  Object.assign(view, { VS, ox, oy, x0: ax, y0: ay, w: aw, h: ah });
  ctx.save();
  ctx.beginPath(); ctx.rect(ax, ay, aw, ah); ctx.clip();
  ctx.setTransform(dpr * VS, 0, 0, dpr * VS, dpr * ox, dpr * oy);

  const gc = S.look.ground, ge = S.look.edge;            // 地面の色は、曲の雰囲気に合わせて
  ctx.fillStyle = gc; ctx.fillRect(0, 0, C.FIELD_W, C.FIELD_H);
  ctx.strokeStyle = ge; ctx.lineWidth = 3; ctx.strokeRect(0, 0, C.FIELD_W, C.FIELD_H);
  if (song.part === 'build' || feast()) {               // ため・サビ：広場のふちが拍に合わせて光る
    const a = Math.pow(1 - beatPhase(), 2) * (song.part === 'build' ? 0.9 : 0.55);
    ctx.strokeStyle = `rgba(${S.look.glow},${a})`; ctx.lineWidth = (6 + 6 * a) / VS; ctx.strokeRect(0, 0, C.FIELD_W, C.FIELD_H);
  }
  drawNest();
  drawFoods();
  drawHamster();
  drawFlyers();
  for (const m of motes) {                  // 体・歯が伸びた：オレンジ（体）・青（歯）の小さな光が上っていく
    if (m.t < 0) continue;
    const a = 1 - m.t / m.life;
    ctx.fillStyle = `rgba(${m.col},${a * 0.35})`; ctx.beginPath(); ctx.arc(m.x, m.y, 7 / VS, 0, TAU); ctx.fill();
    ctx.fillStyle = `rgba(${m.col},${a})`; ctx.beginPath(); ctx.arc(m.x, m.y, 3.2 / VS, 0, TAU); ctx.fill();
  }
  if (C.SHOW_LABELS || helpOpen) drawLabels((compact ? 12 : 14) / VS);   // 食べ物の数値は、ふだんは出さない
  if (song.nestShow > 0) {                  // 曲の始まり：曲名と、巣の山と宝の合計（1〜2秒だけ。操作のじゃまはしない）
    const a = clamp(song.nestShow / 0.5, 0, 1), R = Math.max(22, pileR(nest.total)), ty = C.FIELD_H / 2 - R * 0.86 - (stageOf(nest.total) >= 4 ? R * 0.9 : 8) - 18 / VS;
    ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.lineJoin = 'round';
    const t1 = `♪ ${S.name}`, t2 = `${stageName(nest.total)}　宝 ${nest.total}`;
    ctx.font = `bold ${20 / VS}px ${FONT}`; ctx.lineWidth = 5 / VS; ctx.strokeStyle = 'rgba(0,0,0,0.7)';
    ctx.strokeText(t1, C.FIELD_W / 2, ty - 22 / VS); ctx.fillStyle = '#ffffff'; ctx.fillText(t1, C.FIELD_W / 2, ty - 22 / VS);
    ctx.font = `bold ${16 / VS}px ${FONT}`; ctx.strokeText(t2, C.FIELD_W / 2, ty); ctx.fillStyle = '#ffe9a0'; ctx.fillText(t2, C.FIELD_W / 2, ty);
    ctx.globalAlpha = 1;
  }
  if (input.rHeld && input.rTime > 0.12) {
    const p = clamp(input.rTime / C.R_HOLD_SEC, 0, 1), rr = ham.r + 12 / VS;
    ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 4 / VS;
    ctx.beginPath(); ctx.arc(ham.x, ham.y, rr, -Math.PI / 2, -Math.PI / 2 + p * TAU); ctx.stroke();
    ctx.font = `bold ${16 / VS}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillStyle = '#fff';
    ctx.fillText('最初から', ham.x, ham.y - rr - 6 / VS);
  }
  for (const g of rings) {
    if (g.t < 0) continue;
    const p = g.t / g.life, e = 1 - (1 - p) * (1 - p);
    ctx.strokeStyle = `rgba(${g.color},${1 - p})`; ctx.lineWidth = g.width * (1 - p * 0.5);
    ctx.beginPath(); ctx.arc(g.x, g.y, g.r0 + e * g.grow, 0, TAU); ctx.stroke();
  }
  for (const k of sparks) {          // 宝石のかたまりを食べ切ったときの、きらっ
    if (k.t < 0) continue;
    const p = k.t / k.life, e = 1 - (1 - p) * (1 - p);
    ctx.globalAlpha = 1 - p * p;
    sparkle(k.x, k.y, k.s * (0.5 + 0.7 * Math.sin(Math.min(1, p * 1.6) * Math.PI / 2)));
    for (let i = 0; i < 5; i++) { const a = i / 5 * TAU + 0.4, r = k.s * (0.6 + 1.2 * e); sparkle(k.x + Math.cos(a) * r, k.y + Math.sin(a) * r, k.s * 0.28 * (1 - p)); }
    ctx.strokeStyle = `rgba(200,250,255,${1 - p})`; ctx.lineWidth = 3 / VS;
    ctx.beginPath(); ctx.arc(k.x, k.y, k.s * (0.6 + 1.6 * e), 0, TAU); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawHUD(W, compact);
  drawSongBand(W, BAND);
  const rowY = !touchUI ? H - 23 : between ? H - 8 - 19 : H - 8 - 38 - 22;
  const rx0 = between ? (padL.offsetWidth || 0) + 18 : PAD + 2, rx1 = between ? W - (padR.offsetWidth || 0) - 18 : W - PAD - 2 - (touchUI ? 0 : 46);
  drawBottom(rx0, rx1, rowY);
  drawMsg(ax, ay, aw, ah);
  if (paused && !helpOpen) {                             // 一時停止（曲の時計も止まっている）。触れる・キーで続きから
    const py = songOver ? ay + 40 : ay + ah / 2;
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    ctx.font = `900 30px ${FONT}`; ctx.lineWidth = 7; ctx.strokeStyle = 'rgba(20,15,10,0.85)'; ctx.strokeText('一時停止', W / 2, py - 18);
    ctx.fillStyle = '#fff'; ctx.fillText('一時停止', W / 2, py - 18);
    const pr = 13 * (1 + 0.12 * Math.sin(performance.now() / 180));   // ▶（続きから）
    ctx.fillStyle = '#ffe14a'; ctx.beginPath(); ctx.moveTo(W / 2 - pr * 0.7, py + 22 - pr); ctx.lineTo(W / 2 + pr, py + 22); ctx.lineTo(W / 2 - pr * 0.7, py + 22 + pr); ctx.closePath(); ctx.fill();
    return;
  }
  if (!started && !songOver && !helpOpen) drawStartHint();
  else if (touchUI && (!AC || AC.state !== 'running') && !songOver) drawSpeaker(ax + aw / 2, ay + ah - 34, true);   // スマホ：画面に触れるまで音を出せない
}
// 上の目盛り：果物（体）・宝石（歯）・頬袋の絵と目盛り、★の目盛り。文字は曲名と巣の数だけ
const NEED_FRUIT = { look: 'soft', s: 5.5, h: 1, seed: 0.37 }, NEED_GEM = { look: 'gem', s: 1, h: 5, seed: 0.61 };
function iconPouch(x, y, s) {   // 頬袋：ほっぺがふくらんだハムスターの顔

      lx = lerp(wx * cos + wy * sin, lx, e); ly = lerp(-wx * sin + wy * cos, ly, e);

  const skin = extra => {
    ctx.beginPath();
    for (const c of cheeks) {
      const ar = r * (0.42 + 0.3 * Math.min(2.2, Math.max(0, ham.puff - 1))) * (1 + ham.cheekW[c][0]) + extra, ax = -r * 0.1, ay = c * r * (0.55 + 0.12 * Math.min(2, Math.max(0, ham.puff - 1)));   // 頬袋：たまるほど、ぱんぱんに
      ctx.moveTo(ax + ar, ay); ctx.arc(ax, ay, ar, 0, TAU);
    }

    ctx.fillStyle = fullNow ? '#d8402a' : '#5b3a1e'; skin(fullNow ? 3 : 2);

  const tl = (1.5 + ham.teeth * 0.7) * hamScale(), tw = Math.max(1.2, r * 0.12);
  ctx.fillStyle = '#fffdf0'; ctx.strokeStyle = '#5b3a1e'; ctx.lineWidth = 0.8;

  const lx = ham.ix * cos + ham.iy * sin, ly = -ham.ix * sin + ham.iy * cos, look = ham.ix || ham.iy ? 1 : 0.4;

      ctx.lineCap = 'butt';

    }
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(ex, ey, er, 0, TAU); ctx.fill();
    ctx.lineWidth = Math.max(0.6, r * 0.04); ctx.strokeStyle = '#5b3a1e'; ctx.stroke();

    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(qx - pr * 0.35, qy - pr * 0.35, pr * 0.32, 0, TAU); ctx.fill();

  ctx.fillStyle = '#e86a7a';
  ctx.beginPath(); ctx.arc(r * 0.86, 0, Math.max(1, r * 0.1), 0, TAU); ctx.fill();
  ctx.restore();
}


function drawLabels(fs) {
  const near = [];
  for (const f of foods) {
    if (f.born < 1 || f.suck) continue;
    const d = f.boulder ? -1 : rectDist(f, ham.x, ham.y) - ham.r;
    if (d < C.LABEL_RANGE) near.push([f, d]);
  }
  near.sort((a, b) => a[1] - b[1]);
  ctx.font = `bold ${fs}px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
  ctx.lineWidth = fs * 0.22; ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  for (const [f] of near.slice(0, 7)) {
    const parts = [];
    parts.push(['大' + fmt(f.s), f.s > ham.body + EPS ? '#d81e10' : '#1f3b1f']);
    parts.push([' 硬' + fmt(f.h), f.h > ham.teeth + EPS ? '#d81e10' : '#1f3b1f']);
    let x = f.x - parts.reduce((a, p) => a + ctx.measureText(p[0]).width, 0) / 2;
    const y = f.y - f.w / 2 - fs * 0.3;
    for (const [t, c] of parts) {
      ctx.strokeText(t, x, y); ctx.fillStyle = c; ctx.fillText(t, x, y);
      x += ctx.measureText(t).width;
    }
  }
}

// ---------------- 音（その場で合成） ----------------
//   曲ごとの楽器・刻み・和音・テーマの編曲は、曲の設計図（SONGS）に書いてある。ここは、どの曲でも共通の仕組み
//   効果音モード：食べた瞬間に鳴る。続けて食べると少しずつ間をあけて並べ、その曲の音階で1段ずつ上がり、間が空くと最初に戻る
//   音楽モード：背景に、体と歯の育ち具合で厚くなる音楽。食べた瞬間には音の高さのない小さな「ぷち」だけ鳴らし、
//     音の高さのある音は、その曲の刻み（はね具合も）にそろえて、和音に合う高さで鳴らす
//   宝石の列：食べるごとに、テーマのメロディを一音ずつ（その曲の編曲で）。食べ切ると主音（和音になければ根音）に着地して、次の拍の頭でバンドが応える
//   宝石のかたまり：ほぼ同時に食べた音は、1つの和音に。食べ切ると、花が開くような分散和音と低い根音、きらっ、バンドの応え
//   果物：その曲のリズムとベースの楽器で、2〜3音の短いフレーズ。続けて食べると、背景にリズムとベースの層が一時的に加わる
//   取れない物に当たった音も、その曲の楽器で（大きさが足りない＝低い音、歯が足りない＝高い音）
//   音の行き先：背景の音楽は「音楽」の音量、それ以外は「効果音」の音量を通って、「全体」の音量へ
let AC = null, master = null, musicBus = null, sfxBus = null, curBus = null, noiseBuf = null, distCurve = null, soundMode = C.SOUND_MODE_START;
const outBus = () => curBus || sfxBus;
const lv = L => (L / 8) ** 2;                   // 目盛り → 大きさ（8 が基準の1倍、10 で約1.6倍、0 で消音）
function applyVol() {
  if (!AC) return;
  const t = AC.currentTime;
  master.gain.setTargetAtTime(C.SOUND_VOLUME * lv(vol.all), t, 0.02);
  musicBus.gain.setTargetAtTime(lv(vol.music), t, 0.02);
  sfxBus.gain.setTargetAtTime(lv(vol.sfx), t, 0.02);
}
const midiHz = m => 440 * Math.pow(2, (m - 69) / 12), hz = midiHz;
const hzMidi = f => 69 + 12 * Math.log2(f / 440);
const wobble = () => 1 + (Math.random() - 0.5) * 0.01;   // 同じ音でも耳が疲れないよう、高さをほんの少し（±0.5%）だけ揺らす
const wob = () => (Math.random() - 0.5) * 0.17;           //   同じことを半音の単位で
const sfx = { step: 0, lastNoteT: -9, qNext: 0, lastBump: -9, last: { m: -1, g: -1 } };
// 食べ物がどちらを伸ばすか：'soft'＝大きさ、'hard'＝硬さ、'both'＝両方
const kindOf = (s, h) => { const r = h / (s + h); return r >= 0.58 ? 'hard' : r <= 0.42 ? 'soft' : 'both'; };

function audioInit() {          // ブラウザの決まりで、最初のキー入力のあとに音を出せるようにする
  if (AC) { if (AC.state === 'suspended' && !paused) AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    audioChain(AC);
    const un = AC.createBufferSource(); un.buffer = AC.createBuffer(1, 1, 22050); un.connect(AC.destination); un.start(0);   // iPhone で音を出せるようにする合図
    if (soundMode === 'music') musicStart();
  } catch (e) { AC = null; }
}
function audioChain(ac) {       // 音の行き先（音量 → 耳に痛い高い成分を落とす → 大きすぎる音をおさえる）と、音のもと
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 7000;
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -20; comp.ratio.value = 4;
  master = ac.createGain(); master.gain.value = C.SOUND_VOLUME * lv(vol.all);
  musicBus = ac.createGain(); sfxBus = ac.createGain();
  musicBus.gain.value = lv(vol.music); sfxBus.gain.value = lv(vol.sfx);
  musicBus.connect(master); sfxBus.connect(master);
  master.connect(lp); lp.connect(comp); comp.connect(ac.destination);
  const n = ac.createBuffer(1, ac.sampleRate, ac.sampleRate), d = n.getChannelData(0);   // ざらざらした音のもと
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  noiseBuf = n;
  distCurve = new Float32Array(1024);                                                     // ひずませる形（なめらかに頭を丸める）
  for (let i = 0; i < 1024; i++) { const x = i / 1023 * 2 - 1; distCurve[i] = Math.tanh(x * 2.5) / Math.tanh(2.5); }
}
const live = () => AC && C.SOUND_VOLUME > 0;
// 音のもと：発振器 →（ひずみ）→（フィルター）→ 音量の形 →（ゆれ）→（左右）→ 行き先。t は鳴らす時刻（音の時計）、f は高さ(Hz)、dur は長さ（秒）
function syn(t, f, dur, vol, o = {}) {
  if (!live() || !(vol > 0) || !(f > 0)) return;
  t = Math.max(t, AC.currentTime);
  const { type = 'sine', atk = 0.005, hold = 0, slide = 0, slideT = 0, flt = '', ff = 0, ffTo = 0, ffT = 0, q = 0.7, det = 0, vib = 0, trem = 0, drive = 0, pan = 0 } = o;
  const end = t + Math.max(dur, atk + hold + 0.01), osc = AC.createOscillator(), g = AC.createGain();
  osc.type = type; osc.frequency.setValueAtTime(f, t); if (det) osc.detune.value = det;
  if (slide) osc.frequency.exponentialRampToValueAtTime(slide, t + (slideT || dur));
  if (vib) {                                   // ビブラート：少し遅れてかかる
    const l = AC.createOscillator(), lg = AC.createGain(); l.frequency.value = 5.5;
    lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(f * vib, t + Math.min(0.25, dur * 0.5));
    l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(end + 0.05);
  }
  let node = osc;
  if (drive) { const pre = AC.createGain(), ws = AC.createWaveShaper(); pre.gain.value = drive; ws.curve = distCurve; node.connect(pre); pre.connect(ws); node = ws; }
  if (flt) {
    const fl = AC.createBiquadFilter(); fl.type = flt; fl.Q.value = q; fl.frequency.setValueAtTime(ff, t);
    if (ffTo) fl.frequency.exponentialRampToValueAtTime(ffTo, t + (ffT || dur));
    node.connect(fl); node = fl;
  }
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + atk);
  if (hold) g.gain.setValueAtTime(vol, t + atk + hold);
  g.gain.exponentialRampToValueAtTime(0.0001, end);
  node.connect(g); node = g;
  if (trem) {                                  // 音量のゆれ（ビブラフォン）
    const tg = AC.createGain(), l = AC.createOscillator(), lg = AC.createGain(); tg.gain.value = 0.8; l.frequency.value = trem; lg.gain.value = 0.2;
    l.connect(lg); lg.connect(tg.gain); node.connect(tg); node = tg; l.start(t); l.stop(end + 0.05);
  }
  if (pan) { const sp = AC.createStereoPanner(); sp.pan.value = pan; node.connect(sp); node = sp; }
  node.connect(outBus());
  osc.start(t); osc.stop(end + 0.05);
}
function tone(freq, dur, type, vol, { slideTo = 0, delay = 0, attack = 0.005, pan = 0 } = {}) {   // いまから delay 秒後に鳴らす（pan：左(-1)〜右(1)）
  if (!AC) return;
  syn(AC.currentTime + Math.max(0, delay), freq, dur, vol, { type, slide: slideTo, atk: attack, pan });
}
function noise(t, dur, vol, type, freq, q = 1, atk = 0.003) {   // 短いざらざら音（チッ、タッ、シャーン）
  if (!live() || !noiseBuf) return;
  const src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  src.buffer = noiseBuf; src.loop = true; f.type = type; f.frequency.value = freq; f.Q.value = q;
  t = Math.max(t, AC.currentTime);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + atk); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(outBus()); src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.02);
}
function noiseSweep(t, dur, vol, f0, f1, q = 1.2) {   // フィルターを動かしながら鳴らす「シューッ」
  if (!live() || !noiseBuf) return;
  t = Math.max(t, AC.currentTime);
  const src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  src.buffer = noiseBuf; src.loop = true; f.type = 'bandpass'; f.Q.value = q;
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.9); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.05);
  src.connect(f); f.connect(g); g.connect(outBus()); src.start(t); src.stop(t + dur + 0.1);
}
function kick(t, vol, { f0 = 120, f1 = 45, len = 0.22, bend = 0.14, click = 0, drive = 0 } = {}) {   // バスドラム「ドン」
  if (!live()) return;
  t = Math.max(t, AC.currentTime);
  const o = AC.createOscillator(), g = AC.createGain();
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + bend);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
  let n = o;
  if (drive) {                                 // ひずませて重く。耳に痛くならないよう、高い成分は落とす
    const pre = AC.createGain(), ws = AC.createWaveShaper(), lp = AC.createBiquadFilter();
    pre.gain.value = drive; ws.curve = distCurve; lp.type = 'lowpass'; lp.frequency.value = 2200;
    n.connect(pre); pre.connect(ws); ws.connect(lp); n = lp;
  }
  n.connect(g); g.connect(outBus()); o.start(t); o.stop(t + len + 0.03);
  if (click) noise(t, 0.012, vol * click, 'highpass', 3000);
}

// ---- 楽器 ----
function marimba(t, f, vol, weight = 0, pan = 0) {   // 温かい木の音。weight（0〜1）が大きいほど低い音を重ねて重く
  syn(t, f, 0.35 + 0.25 * weight, vol, { atk: 0.004, pan });
  syn(t, f * 4, 0.06, vol * 0.2, { atk: 0.002, pan });
  syn(t, f * 2, 0.15, vol * 0.12, { type: 'triangle', atk: 0.003, pan });
  if (weight > 0.5) syn(t, f / 2, 0.45, vol * 0.6 * weight, { atk: 0.006, pan });
}
function glass(t, f, vol, pan = 0) {   // きらきらしたベル・ガラスの音：少しずれた倍音を長めに残す
  syn(t, f, 0.9, vol, { atk: 0.002, pan });
  syn(t, f * 2.76, 0.45, vol * 0.3, { atk: 0.002, pan });
  syn(t, f * 5.4, 0.2, vol * 0.1, { atk: 0.002, pan });
}
function bell(t, f, vol, dur) {   // 鐘のような音
  syn(t, f, dur, vol, { atk: 0.004 });
  syn(t, f * 2, dur * 0.6, vol * 0.35, { atk: 0.004 });
  syn(t, f * 3, dur * 0.35, vol * 0.12, { atk: 0.004 });
}
function tom(t, f, vol) { syn(t, f, 0.2, vol, { slide: f * 0.6, atk: 0.002 }); noise(t, 0.04, vol * 0.25, 'bandpass', f * 4); }   // タム（フィルの太鼓）
function snare(t, vol) { noise(t, 0.13, vol, 'bandpass', 1900); syn(t, 190, 0.07, vol * 0.6, { type: 'triangle', slide: 150, atk: 0.002 }); }   // 小太鼓
function crash(t, vol, len = 1.6) { noise(t, len, vol, 'highpass', 5200); noise(t, len * 0.4, vol * 0.7, 'bandpass', 3000); }   // シンバル「ジャン」
function clap(t, v) { noise(t, 0.02, v, 'bandpass', 1400); noise(t + 0.012, 0.02, v * 0.8, 'bandpass', 1300); noise(t + 0.024, 0.09, v * 0.7, 'bandpass', 1200); }   // 手拍子
function woodKnock(t, f, vol) {   // 木をコツンと叩く、こもった音（低いほど長く）
  f *= wobble();
  syn(t, f, f < 300 ? 0.11 : 0.07, vol, { slide: f * 0.82, atk: 0.002 });
  noise(t, 0.025, vol * 0.25, 'bandpass', f * 2.2);
}
function epiano(t, f, dur, vol) {   // エレピ（ローズ風）：やわらかく叩いた金属の棒の、丸くて温かい音
  if (!live()) return;
  t = Math.max(t, AC.currentTime);
  const c = AC.createOscillator(), m = AC.createOscillator(), mg = AC.createGain(), g = AC.createGain(), end = t + Math.max(0.35, dur) + 0.45;
  c.frequency.value = f; m.frequency.value = f;
  mg.gain.setValueAtTime(f * 1.5, t); mg.gain.exponentialRampToValueAtTime(f * 0.06, t + 0.5);   // 叩いた瞬間だけ、少し明るい
  m.connect(mg); mg.connect(c.frequency);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.004); g.gain.exponentialRampToValueAtTime(vol * 0.45, t + 0.3); g.gain.exponentialRampToValueAtTime(0.0001, end);
  c.connect(g); g.connect(outBus()); c.start(t); m.start(t); c.stop(end + 0.05); m.stop(end + 0.05);
}
function fmBell(t, f, vol) {   // エレピの高い所の、きらっとした鐘の音
  if (!live()) return;
  t = Math.max(t, AC.currentTime);
  const c = AC.createOscillator(), m = AC.createOscillator(), mg = AC.createGain(), g = AC.createGain(), end = t + 1.1;
  c.frequency.value = f; m.frequency.value = f * 3.5;
  mg.gain.setValueAtTime(f * 2.2, t); mg.gain.exponentialRampToValueAtTime(f * 0.1, t + 0.8);
  m.connect(mg); mg.connect(c.frequency);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, end);
  c.connect(g); g.connect(outBus()); c.start(t); m.start(t); c.stop(end + 0.05); m.stop(end + 0.05);
}
function slap(t, f, dur, vol, pop) {   // チョッパーベース：親指で叩く「ブン」（pop：指ではじく、明るい「ペチッ」）
  const d = Math.max(pop ? 0.1 : 0.14, dur * 0.9);
  syn(t, f, d, vol, { type: 'sawtooth', atk: 0.002, flt: 'lowpass', ff: pop ? 3400 : 1900, ffTo: pop ? 700 : 260, ffT: 0.15, q: 2 });
  syn(t, f, d, vol * 0.7, { atk: 0.003 });
  noise(t, 0.014, vol * (pop ? 0.5 : 0.3), 'bandpass', pop ? 2600 : 1200);
}
function synthLead(t, f, dur, vol) {   // シンセのリード：やわらかい四角い音に、少しゆれ
  syn(t, f, dur, vol, { type: 'square', atk: 0.012, hold: dur * 0.5, flt: 'lowpass', ff: 2600, ffTo: 1300, ffT: dur, q: 1, vib: 0.006 });
  syn(t, f * 1.003, dur, vol * 0.5, { type: 'sawtooth', atk: 0.012, hold: dur * 0.5, flt: 'lowpass', ff: 1800, q: 0.7 });
}
function upright(t, f, dur, vol) {   // ウッドベース：太い弦をはじいた「ボン」
  const d = Math.max(0.25, dur);
  syn(t, f, d, vol, { type: 'triangle', atk: 0.006, flt: 'lowpass', ff: 1000, ffTo: 300, ffT: 0.3 });
  syn(t, f, d, vol * 0.8, { atk: 0.005 });
  noise(t, 0.02, vol * 0.25, 'lowpass', 700);
}
function trumpet(t, f, dur, vol) {   // ミュートしたトランペット：鼻にかかった「ワッ」
  syn(t, f, dur, vol, { type: 'sawtooth', atk: 0.025, hold: dur * 0.6, flt: 'bandpass', ff: 700, ffTo: 1500, ffT: 0.08, q: 2.2, vib: 0.007 });
  syn(t, f, dur, vol * 0.35, { type: 'square', atk: 0.03, hold: dur * 0.6, flt: 'lowpass', ff: 1700 });
}
function acid(t, f, dur, vol, lead) {   // アシッド：フィルターがうねる、くせのある電子音（4小節かけて開いたり閉じたりする）。lead：テーマ用に、閉じても明るく
  const ph = (t - mus.t0) / (barSec() * 4), open = 0.5 - 0.5 * Math.cos(ph * TAU), cut = lead ? 1000 + 2200 * open : 240 + 1500 * open, d = Math.max(0.08, dur);
  syn(t, f, d, vol, { type: 'sawtooth', atk: 0.003, flt: 'lowpass', ff: Math.min(7000, cut * 3.2), ffTo: cut, ffT: 0.1, q: lead ? 5 : 8 });
  if (lead) syn(t, f * 1.006, d, vol * 0.4, { type: 'square', atk: 0.003, flt: 'lowpass', ff: 2400, q: 0.7 });
}
const METAL_HZ = [205.3, 369.6, 522.7];   // 金属の響き（ずれた倍音を重ねる）
function metal(t, vol, d) {   // 金属的なノイズ
  if (!live()) return;
  t = Math.max(t, AC.currentTime);
  const bp = AC.createBiquadFilter(), hp = AC.createBiquadFilter(), g = AC.createGain();
  bp.type = 'bandpass'; bp.frequency.value = 6400; bp.Q.value = 1.4; hp.type = 'highpass'; hp.frequency.value = 4200;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  bp.connect(hp); hp.connect(g); g.connect(outBus());
  for (const f of METAL_HZ) { const o = AC.createOscillator(); o.type = 'square'; o.frequency.value = f * 1.7; o.connect(bp); o.start(t); o.stop(t + d + 0.02); }
}
// 設計図から名前で呼ぶ楽器：どれも (t 鳴らす時刻, m 音の高さ（MIDI 番号。太鼓は使わない）, l 長さ（秒）, v 大きさ, o 細かい指定)
const VO = {
  // 共通・ポップ
  sine: (t, m, l, v, o) => syn(t, hz(m), l || 1, v, { atk: o.atk ?? 0.01 }),
  tri: (t, m, l, v, o) => syn(t, hz(m), l || 0.3, v, { type: 'triangle', atk: o.atk ?? 0.005 }),
  bassTri: (t, m, l, v) => syn(t, hz(m), l, v, { type: 'triangle', atk: 0.01 }),
  padTri: (t, m, l, v, o) => syn(t, hz(m), l, v, { type: 'triangle', atk: o.atk ?? 0.3 }),
  padSine: (t, m, l, v, o) => syn(t, hz(m), l, v, { atk: o.atk ?? 0.5 }),
  grooveBass: (t, m, l, v) => { syn(t, hz(m), l, v, { type: 'triangle', atk: 0.004 }); syn(t, hz(m) * 2, l * 0.45, v * 0.3, { atk: 0.003 }); },
  marimba: (t, m, l, v, o) => marimba(t, hz(m), v, o.w || 0),
  leadPop: (t, m, l, v) => { marimba(t, hz(m), v); glass(t, hz(m + 12), v * 0.4); },
  glass: (t, m, l, v) => glass(t, hz(m), v),
  bell: (t, m, l, v) => bell(t, hz(m), v, l || 0.9),
  woodDrum: (t, m, l, v) => syn(t, 150, 0.16, v, { slide: 95 }),
  wood: (t, m, l, v) => woodKnock(t, hz(m), v),
  kick: (t, m, l, v) => kick(t, v),
  snare: (t, m, l, v) => snare(t, v),
  tom: (t, m, l, v) => tom(t, hz(m), v),
  crash: (t, m, l, v) => crash(t, v, l || 1.6),
  hat: (t, m, l, v) => noise(t, 0.035, v, 'highpass', 8000),
  hatSoft: (t, m, l, v) => noise(t, 0.03, v, 'highpass', 6500),
  shaker: (t, m, l, v) => noise(t, 0.022, v, 'highpass', 7500),
  openHat: (t, m, l, v) => noise(t, 0.09, v, 'highpass', 5000),
  clapPop: (t, m, l, v) => { noise(t, 0.14, v, 'bandpass', 1500); syn(t, 200, 0.08, v * 0.86); },
  clap: (t, m, l, v) => clap(t, v),
  swish: (t, m, l, v) => noise(t, eighth(), v, 'bandpass', 3000),
  // シティポップ
  kickTight: (t, m, l, v) => kick(t, v, { f0: 150, f1: 50, len: 0.2, bend: 0.08, click: 0.25 }),
  snareCity: (t, m, l, v) => { snare(t, v); noise(t + 0.02, 0.22, v * 0.25, 'bandpass', 2400); },
  rim: (t, m, l, v) => { noise(t, 0.018, v, 'bandpass', 1700, 2); syn(t, 820, 0.025, v * 0.5, { type: 'triangle', atk: 0.001 }); },
  epiano: (t, m, l, v) => epiano(t, hz(m), l || 0.6, v),
  epBell: (t, m, l, v) => fmBell(t, hz(m), v),
  slap: (t, m, l, v) => slap(t, hz(m), l, v, false),

  if (k > land) playCalm(k, t);                        // 余韻に重ねて、結果の画面の静かな和音が入る
}
// 結果の画面：ゆっくり息をするような、静かな和音だけ（食べた音とまちがえないよう、粒の音は鳴らさない）。しばらくしたら静かに止む
function playCalm(k, t) {
  if (!isFinite(song.calmFrom)) return;
  const k0 = Math.ceil(song.calmFrom / beatSec() - 1e-6) * 4, j = k - k0, bar = j / 16;   // 着地から END_CALM_AFTER 秒たった次の拍から
  if (j < 0 || j % 32 || bar >= 16) return;          // 2小節ごとに、16小節まで（だんだん小さく）
  const ch = CH.calm[(bar / 2) % CH.calm.length], d = barSec() * 2, v = C.MUSIC_VOLUME * (1 - bar / 18), first = bar === 0;   // 最初の和音は、特にゆっくり立ち上がる
  for (const m of chordNotes(ch, 52, 71)) syn(t, hz(m), d * 1.15, 0.005 * v, { type: 'triangle', atk: d * (first ? 0.6 : 0.45), hold: d * 0.2, flt: 'lowpass', ff: 1100 });
  syn(t, hz(rootIn(ch, 36)), d * 1.1, 0.018 * v, { atk: d * (first ? 0.55 : 0.35) });
}
function riser(t, end) {         // ため：サビの頭（end）へ向けて「シューッ」と盛り上げる
  noiseSweep(t, Math.max(0.2, end - Math.max(t, AC.currentTime)), 0.04, 400, 6000);
  noise(end, 1.6, 0.03, 'highpass', 4000);
}

// ---------------- 動作確認用の自動プレイ ----------------
// URL に ?bot を付けると自動で遊ぶ（?bot&speed=10 で早回し）。
// コンソールで simulate() を呼ぶと画面を使わずに1曲を最後まで遊んで、結果を返す（数値調整の目安用）。
const bot = { target: null, plan: null, planT: 0, ban: new Map() };
const GRID = 10, GW = Math.ceil(C.FIELD_W / GRID), GH = Math.ceil(C.FIELD_H / GRID);
function botPlan(f) {             // 目標までの距離マップ（食べられないものを避けた格子の上で幅優先探索）
  const blocked = new Uint8Array(GW * GH), dist = new Int32Array(GW * GH).fill(-1);
  const r = ham.r + 1, q = [];
  for (let gy = 0; gy < GH; gy++) for (let gx = 0; gx < GW; gx++) {   // 壁ぎわ（体が入りきらない所）
    const cx = (gx + 0.5) * GRID, cy = (gy + 0.5) * GRID;
    if (cx < r || cy < r || cx > C.FIELD_W - r || cy > C.FIELD_H - r) blocked[gy * GW + gx] = 1;
  }
  for (const o of foods) {
    if (o.edible) continue;
    const hw = o.w / 2 + r;
    for (let gy = Math.max(0, Math.floor((o.y - hw) / GRID)); gy <= Math.min(GH - 1, Math.floor((o.y + hw) / GRID)); gy++)
      for (let gx = Math.max(0, Math.floor((o.x - hw) / GRID)); gx <= Math.min(GW - 1, Math.floor((o.x + hw) / GRID)); gx++)
        if (rectDist(o, (gx + 0.5) * GRID, (gy + 0.5) * GRID) < r) blocked[gy * GW + gx] = 1;
  }
  const hw = f.w / 2 + r + C.EAT_REACH * 0.5;
  for (let gy = Math.max(0, Math.floor((f.y - hw) / GRID)); gy <= Math.min(GH - 1, Math.floor((f.y + hw) / GRID)); gy++)
    for (let gx = Math.max(0, Math.floor((f.x - hw) / GRID)); gx <= Math.min(GW - 1, Math.floor((f.x + hw) / GRID)); gx++) {
      const i = gy * GW + gx;
      if (!blocked[i] && rectDist(f, (gx + 0.5) * GRID, (gy + 0.5) * GRID) < r + C.EAT_REACH * 0.5) { dist[i] = 0; q.push(i); }
    }
  for (let qi = 0; qi < q.length; qi++) {
    const i = q[qi], x = i % GW, y = (i / GW) | 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const nx = x + dx, ny = y + dy;
      if ((!dx && !dy) || nx < 0 || ny < 0 || nx >= GW || ny >= GH) continue;
      const j = ny * GW + nx;
      if (blocked[j] || dist[j] >= 0) continue;
      if (dx && dy && (blocked[y * GW + nx] || blocked[ny * GW + x])) continue;
      dist[j] = dist[i] + 1; q.push(j);
    }
  }
  return dist;
}
function botPick() {
  const fe = feast(), wB = ham.body < C.GROW_GOAL ? 1 / ham.body : 0.02, wT = ham.teeth < C.GROW_GOAL ? 1 / ham.teeth : 0.02;
  let best = null, bs = -1;
  for (const f of foods) {
    if (!f.edible || f.born < 1 || f.suck || (bot.ban.get(f) ?? -1) > clock) continue;
    const g = gains(f.s, f.h);
    const sc = fe ? (f.cluster ? 1.5 : 1) / (rectDist(f, ham.x, ham.y) + 30) : (g.body * wB + g.teeth * wT) / (rectDist(f, ham.x, ham.y) + 60);   // サビ：近い物からどんどん
    if (sc > bs) { bs = sc; best = f; }
  }
  return best;
}
function botThink(dt) {
  input.up = input.down = input.left = input.right = input.eat = false;
  if (songOver || song.burst) return;
  if (!bot.target || !foods.includes(bot.target) || !bot.target.edible || bot.target.suck) { bot.target = botPick(); bot.plan = null; }
  const f = bot.target;
  if (!f) return;
  if (eatMode === 'A' && rectDist(f, ham.x, ham.y) - ham.r <= C.EAT_REACH) { input.eat = true; return; }
  if (!bot.plan || (bot.planT -= dt) <= 0) { bot.plan = botPlan(f); bot.planT = 0.3; }
  // 今いるマスの周り（5×5）で、いちばん目標に近いマスへ向かう
  const hx = Math.floor(ham.x / GRID), hy = Math.floor(ham.y / GRID);
  let bx = -1, by = -1, bd = Infinity;
  for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
    const x = hx + dx, y = hy + dy;
    if (x < 0 || y < 0 || x >= GW || y >= GH) continue;
    const d = bot.plan[y * GW + x];
    if (d >= 0 && d + Math.hypot(dx, dy) * 0.01 < bd) { bd = d + Math.hypot(dx, dy) * 0.01; bx = x; by = y; }
  }
  if (bx < 0) { bot.ban.set(f, clock + 5); bot.target = null; return; }   // たどり着けない
  let mx = (bx + 0.5) * GRID - ham.x, my = (by + 0.5) * GRID - ham.y;
  if (bd < 1) { mx = f.x - ham.x; my = f.y - ham.y; }
  const m = Math.hypot(mx, my) || 1;
  mx /= m; my /= m;
  input.right = mx > 0.38; input.left = mx < -0.38; input.down = my > 0.38; input.up = my < -0.38;
}
// 1曲を最後まで遊ぶ（結果の画面まで）。サビに入ったときの体・歯、サビで食べた数、噴き出した数などを返す
function simulate(maxSec = 400, idx = song.idx) {
  song.idx = idx; reset(); started = true; bot.target = null; bot.ban.clear();
  const STEP = 1 / 60;
  for (let i = 0; i < maxSec * 60 && !songOver; i++) { botThink(STEP); update(STEP); }
  for (let i = 0; i < 60 * 3 && flyers.length; i++) update(STEP);
  const T = song.times, sec = k => T[k] !== undefined ? +T[k].toFixed(1) : null;
  return { done: songOver, song: song.n, atChorus: song.atChorus && { body: +song.atChorus.body.toFixed(2), teeth: +song.atChorus.teeth.toFixed(2) },
    chorusEaten: song.chorusEaten, burst: song.burstN, nest: nest.total, starts: Object.fromEntries(PARTS.map(([k]) => [k, sec(k)]).concat([['result', sec('result')]])), eaten: eatenCount };
}

// ---------------- ループ ----------------
if (touchUI) setTouchUI();
loadSave();
reset();
let last = performance.now(), acc = 0, slowFor = 0, fps = 60;
const STEP = 1 / 60;
function frame(now) {
  const real = Math.min(0.25, (now - last) / 1000);
  last = now;
  if (!paused) {                                      // 一時停止中は、ゲームの時間を進めない
    acc += Math.min(0.1, real) * SIM_SPEED;
    // 動きが重い（コマ数が LIGHT_FX_FPS を2秒以上下回り続けた）ときは、光や輪などの演出を軽くして、なめらかさを優先する
    if (real > 0) fps = lerp(fps, 1 / real, 0.05);
    if (!lowFx && !document.hidden && fps < C.LIGHT_FX_FPS) { if ((slowFor += real) > 2) lowFx = true; } else slowFor = 0;
    for (let n = 0; acc >= STEP && n < 3000; n++) { if (BOT) botThink(STEP); update(STEP); acc -= STEP; }
  } else acc = 0;
  render();
  if (!volEl.hidden && now > volHideAt) volEl.hidden = true;
  updatePad();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
